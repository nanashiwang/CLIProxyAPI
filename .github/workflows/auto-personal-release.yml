name: auto-personal-release

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write

concurrency:
  group: auto-personal-release
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'nanashiwang/CLIProxyAPI' &&
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify source
        run: |
          set -euo pipefail
          git diff --check
          go test ./...
          go build -o "${RUNNER_TEMP}/cli-proxy-api" ./cmd/server

  tag-and-release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create next personal tag
        id: version
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          existing_tag="$({
            git tag --points-at "${GITHUB_SHA}" |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-personal\.[0-9]+$' |
              sort -V |
              tail -n 1
          } || true)"

          if [[ -n "${existing_tag}" ]]; then
            tag="${existing_tag}"
            echo "Using existing tag: ${tag}"
          else
            base_version="$({
              git tag --merged "${GITHUB_SHA}" |
                sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)(-personal\.[0-9]+)?$/\1/p' |
                sort -V |
                tail -n 1
            } || true)"
            if [[ -z "${base_version}" ]]; then
              echo "Unable to determine the base version" >&2
              exit 1
            fi
            echo "Base version: ${base_version}"
            last_number="$({
              git tag --list "v${base_version}-personal.*" |
                sed -nE "s/^v${base_version//./\\.}-personal\.([0-9]+)$/\\1/p" |
                sort -n |
                tail -n 1
            } || true)"
            next_number=$(( ${last_number:-0} + 1 ))
            tag="v${base_version}-personal.${next_number}"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" "${GITHUB_SHA}" -m "Release ${tag}"
            git push origin "refs/tags/${tag}"
            echo "Created tag: ${tag}"
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Dispatch release build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release already exists: ${TAG}"
            exit 0
          fi
          gh workflow run release.yaml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${TAG}"
          echo "Dispatched release workflow for ${TAG}"
